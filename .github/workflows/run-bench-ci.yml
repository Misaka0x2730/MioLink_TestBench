name: Run Bench CI

# Triggered by MioLink's build pipeline (repository_dispatch) once it has built
# the probe firmware, or manually. Builds the test_board fixtures on a
# GitHub-hosted runner, then runs the hardware-in-the-loop bench on the
# self-hosted runner against the EXACT MioLink artifacts from the triggering
# run (downloaded by run_id), and reports the result back on the MioLink commit.
#
# The self-hosted runner only flashes and tests (no compilation), so it can be
# a low-powered board (e.g. Pi Zero 2W).

on:
  repository_dispatch:
    types: [ miolink-build ]
  workflow_dispatch:
    inputs:
      run_id:
        description: "MioLink build run_id to fetch probe firmware from"
        required: true
        type: string
      sha:
        description: "MioLink commit SHA to report bench status on (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Build the test_board fixtures on a GitHub-hosted runner, in the native
  # run_bench.py layout (firmware/build/cli-X_swo-Y/test_boards/...), and ship
  # the ELFs as an artifact so the self-hosted runner never has to compile.
  build-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup arm-none-eabi-gcc
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      # Same script the bench used to run locally; it also auto-extracts the
      # committed HC32F460 DDL zip when present.
      - name: Build target fixtures
        run: ./build_all_test_firmware.sh --config config/bench_pi5.yaml

      # Pack only the .elf files, preserving the cli-X_swo-Y/test_boards/...
      # structure run_bench.py reads back.
      - name: Stage fixture ELFs
        run: |
          set -euo pipefail
          cd firmware/build
          find . -path '*/test_boards/*/*.elf' -print0 \
            | tar --null -czf "$GITHUB_WORKSPACE/target-fixtures.tar.gz" --files-from -

      - name: Upload target fixtures
        uses: actions/upload-artifact@v4
        with:
          name: target-fixtures
          path: target-fixtures.tar.gz
          if-no-files-found: error

  bench:
    needs: build-fixtures
    runs-on: [ self-hosted, miolink-bench ]
    # One physical bench: queue runs instead of cancelling so concurrent
    # MioLink changes don't fight over the hardware.
    concurrency:
      group: miolink-bench-hardware
      cancel-in-progress: false
    steps:
      # No submodules: the runner only runs run_bench.py (pure scripts/),
      # it does not compile anything.
      - uses: actions/checkout@v4

      - name: Resolve MioLink run id
        shell: bash
        run: |
          set -euo pipefail
          run_id="${{ github.event.client_payload.run_id || inputs.run_id }}"
          if [ -z "$run_id" ]; then
            echo "error: no MioLink run_id (client_payload.run_id / inputs.run_id)" >&2
            exit 1
          fi
          echo "MIOLINK_RUN_ID=$run_id" >> "$GITHUB_ENV"

      # Cross-repo download of the exact .uf2 set this MioLink run produced.
      # The artifact filenames already match the bench's fixed
      # MioLink-<board>-<flavour>.uf2 name, so no renaming is needed.
      - name: Download MioLink probe firmware
        uses: actions/download-artifact@v4
        with:
          repository: Misaka0x2730/MioLink
          run-id: ${{ env.MIOLINK_RUN_ID }}
          github-token: ${{ secrets.MIOLINK_BENCH_TOKEN }}
          pattern: MioLink-*
          merge-multiple: true
          path: build/probe-images

      # Fixtures built by build-fixtures (same workflow run); restore the
      # firmware/build layout run_bench.py expects.
      - name: Download target fixtures
        uses: actions/download-artifact@v4
        with:
          name: target-fixtures
          path: .

      - name: Unpack target fixtures
        run: |
          set -euo pipefail
          mkdir -p firmware/build
          tar -xzf target-fixtures.tar.gz -C firmware/build

      # Runtime-only deps (no build toolchain). If the runner's Python is
      # externally managed (PEP 668), pre-provision a venv and drop this step.
      - name: Install Python dependencies
        run: python3 -m pip install --break-system-packages -r scripts/requirements.txt

      - name: Run bench tests
        run: |
          ./run_bench_tests.sh \
            --config config/bench_pi5.yaml \
            --probe-image-dir build/probe-images \
            --target-build-dir firmware/build

  # Report the bench outcome on the MioLink commit (commit status; renders in
  # the PR checks list). Always runs so a failed/skipped bench still resolves
  # the pending status MioLink set; no-ops when there is no SHA to report on
  # (e.g. a manual run without the sha input).
  report:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report bench status to MioLink
        env:
          GH_TOKEN: ${{ secrets.MIOLINK_BENCH_TOKEN }}
          SHA: ${{ github.event.client_payload.sha || inputs.sha }}
          STATE: ${{ needs.bench.result == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SHA}" ]; then
            echo "No MioLink SHA (manual run without 'sha' input); nothing to report."
            exit 0
          fi
          gh api "repos/Misaka0x2730/MioLink/statuses/${SHA}" \
              -f state="${STATE}" \
              -f context=miolink-bench \
              -f target_url="${RUN_URL}" \
              -f description="HIL bench tests"
